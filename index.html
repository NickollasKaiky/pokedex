<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <h1 class="titulo">Pokédex</h1>
    <p class="descricao">Digite o nome de um Pokémon para ver suas informações.</p>

    <form class="container busca">
        <input type="text" placeholder="Nome do Pokémon...">
        <button><i class="bi bi-search"></i></button>
    </form>

    <h2 class="erro"></h2>
    <h5 class="tente"></h5>

    <div class="container pokebola">
        <img class="imgPokebolaCima" src="assets/images/pokebola_cima.png" alt="Topo Pokebola">
        <img class="imgPokebola" src="assets/images/pokebola.png" alt="Pokebola">

        <section id="resultado"></section>

        <img class="imgPokebolaBaixo" src="assets/images/pokebola_baixo.png" alt="">
    </div>

    <script src="assets/js/script.js" defer></script>
</body>

</html>
